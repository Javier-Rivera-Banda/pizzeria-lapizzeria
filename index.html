<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Pizzería — Pedidos en línea</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #110500; font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    .page {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #2a0d00 0%, #110500 60%);
      padding-bottom: 100px;
    }

    /* Header */
    .header {
      display: flex; align-items: center; gap: 14px;
      padding: 26px 20px 18px;
      border-bottom: 1px solid rgba(232,80,14,0.12);
    }
    .logo { font-size: 40px; }
    .brand { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; color: #fff; }
    .tagline { font-size: 10px; color: #E8500E; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

    /* Progress */
    .progress { display: flex; padding: 16px 12px 8px; position: relative; }
    .progress::before { content: ''; position: absolute; top: 30px; left: 28px; right: 28px; height: 1px; background: rgba(255,255,255,0.05); }
    .prog-item { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; position: relative; z-index: 1; }
    .prog-dot { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #444; font-weight: 600; transition: all 0.3s; }
    .prog-dot.done { background: rgba(232,80,14,0.25); border-color: #E8500E; color: #E8500E; }
    .prog-dot.active { background: #E8500E; border-color: #E8500E; color: #fff; }
    .prog-label { font-size: 9px; color: #3a3a3a; text-transform: uppercase; letter-spacing: 0.5px; }
    .prog-label.active { color: #E8500E; }

    /* Card */
    .card { margin: 14px 14px 0; background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; padding: 22px 16px; }
    .step-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 20px; color: #fff; font-weight: 400; margin-bottom: 18px; }

    /* Pizza grid */
    .pizza-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pizza-card { background: rgba(255,255,255,0.03); border: 1.5px solid rgba(255,255,255,0.06); border-radius: 16px; cursor: pointer; text-align: center; position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden; transition: all 0.2s; }
    .pizza-card:hover { border-color: rgba(232,80,14,0.4); }
    .pizza-card.selected { background: rgba(232,80,14,0.1); border-color: #E8500E; }
    .pizza-card-img { width: 100%; height: 100px; object-fit: cover; display: block; }
    .pizza-card-placeholder { width: 100%; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
    .pizza-card-body { padding: 10px 8px 12px; width: 100%; }
    .pizza-name { color: #fff; font-size: 12px; font-weight: 600; margin-bottom: 3px; }
    .pizza-desc { color: #555; font-size: 10px; line-height: 1.4; }
    .check-badge { position: absolute; top: 7px; right: 7px; background: #E8500E; color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }

    /* Sizes */
    .size-list { display: flex; flex-direction: column; gap: 9px; }
    .size-card { background: rgba(255,255,255,0.03); border: 1.5px solid rgba(255,255,255,0.06); border-radius: 13px; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
    .size-card:hover { border-color: rgba(232,80,14,0.4); }
    .size-card.selected { background: rgba(232,80,14,0.1); border-color: #E8500E; }
    .size-name { color: #fff; font-size: 14px; }
    .size-price { color: #E8500E; font-weight: 700; font-size: 15px; }

    /* Tags */
    .sec-label { color: #E8500E; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; margin-top: 18px; }
    .sec-label:first-child { margin-top: 0; }
    .tag-grid { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 100px; padding: 8px 13px; color: #999; font-size: 12px; cursor: pointer; transition: all 0.18s; }
    .tag:hover { border-color: rgba(232,80,14,0.4); color: #fff; }
    .tag.selected { background: rgba(232,80,14,0.16); border-color: #E8500E; color: #fff; }

    /* Fields */
    .field { margin-bottom: 13px; }
    .field label { display: block; color: #666; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
    .field input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 11px; padding: 13px 14px; color: #fff; font-size: 15px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
    .field input:focus { border-color: #E8500E; }
    .field input::placeholder { color: #3a3a3a; }

    /* Summary */
    .summary { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 16px 15px; margin-bottom: 14px; }
    .sum-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 6px 0; font-size: 13px; color: #fff; gap: 8px; }
    .sum-key { color: #555; min-width: 80px; }
    .sum-right { text-align: right; max-width: 60%; }
    .divider { height: 1px; background: rgba(255,255,255,0.05); margin: 8px 0; }
    .sum-total { font-size: 20px; font-weight: 700; color: #E8500E; }

    /* Nav */
    .nav { display: flex; gap: 10px; margin-top: 20px; }
    .btn-back { background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; padding: 14px 18px; color: #777; font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .btn-back:hover { color: #fff; }
    .btn-next { flex: 1; background: linear-gradient(135deg, #E8500E, #c23c0a); border: none; border-radius: 100px; padding: 14px 22px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; box-shadow: 0 4px 20px rgba(232,80,14,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
    .btn-next:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Floating total */
    .floating-total { position: fixed; bottom: 16px; right: 16px; background: rgba(232,80,14,0.92); color: #fff; border-radius: 100px; padding: 11px 20px; font-size: 13px; box-shadow: 0 4px 24px rgba(232,80,14,0.4); display: none; }

    /* Success */
    .success-wrap { margin: 36px 14px 0; background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; padding: 34px 18px; text-align: center; display: none; }
    .success-icon { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #E8500E, #c23c0a); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 18px; box-shadow: 0 8px 30px rgba(232,80,14,0.4); }
    .success-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; color: #fff; margin-bottom: 6px; }
    .success-sub { color: #666; font-size: 13px; margin-bottom: 22px; }
    .success-rows { margin-bottom: 4px; }
    .success-detail { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: #fff; font-size: 13px; }
    .success-total { font-size: 28px; font-weight: 700; color: #E8500E; margin: 16px 0 6px; }
    .success-note { color: #444; font-size: 12px; margin-bottom: 22px; }

    .error-msg { background: rgba(255,60,60,0.1); border: 1px solid rgba(255,60,60,0.2); border-radius: 10px; padding: 11px 14px; color: #ff7070; font-size: 13px; margin-bottom: 10px; display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 17px; height: 17px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }

    .footer { text-align: center; color: #2a2a2a; font-size: 11px; margin-top: 26px; }
    .footer strong { color: #3a3a3a; }
    .empty-msg { color: #555; font-size: 14px; text-align: center; padding: 30px 0; }
  </style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="logo">🍕</div>
    <div>
      <div class="brand">La Pizzería</div>
      <div class="tagline">Pedidos en línea · Lima, Perú</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress" id="progress"></div>

  <!-- Steps -->
  <div class="card" id="step-container"></div>

  <!-- Success -->
  <div class="success-wrap" id="success-wrap">
    <div class="success-icon">✓</div>
    <div class="success-title">¡Pedido recibido!</div>
    <div class="success-sub" id="success-sub"></div>
    <div class="success-rows" id="success-rows"></div>
    <div class="success-total" id="success-total"></div>
    <div class="success-note" id="success-note"></div>
    <button class="btn-next" onclick="resetForm()" style="margin-top:8px">Hacer otro pedido</button>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error-msg"></div>

  <!-- Floating total -->
  <div class="floating-total" id="floating-total"></div>

  <div class="footer">Powered by <strong>Tu Agencia</strong> · Lima, Perú</div>
</div>

<script>
  // ── CONFIG ─────────────────────────────────────────────────────────────────
  const SB_URL = "https://hrjhifzhrqtcnooitrkx.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyamhpZnpocnF0Y25vb2l0cmt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MzM0MjcsImV4cCI6MjA5NDMwOTQyN30.Kbjn66ApbGhDGiBy-QbeQ9_3s2TPgV_fWmmqW4cCEZ8";
  const STORAGE_KEY = "pizzeria_menu_v1";
  const STEPS = ["Pizza", "Tamaño", "Extras", "Datos", "Confirmar"];

  const DEFAULT_MENU = {
    pizzas: [
      { id: "hawaiana", name: "Hawaiana", desc: "Jamón, piña, mozzarella", emoji: "🍍", imagen: null, activo: true },
      { id: "bbq", name: "BBQ Chicken", desc: "Pollo, cebolla, salsa BBQ", emoji: "🍗", imagen: null, activo: true },
      { id: "pepperoni", name: "Pepperoni", desc: "Pepperoni, mozzarella, orégano", emoji: "🔴", imagen: null, activo: true },
      { id: "cuatro", name: "4 Quesos", desc: "Mozzarella, gouda, edam, parmesano", emoji: "🧀", imagen: null, activo: true },
    ],
    tamanos: [
      { id: "personal", label: "Personal (25cm)", precio: 25, activo: true },
      { id: "mediana", label: "Mediana (30cm)", precio: 35, activo: true },
      { id: "grande", label: "Grande (35cm)", precio: 45, activo: true },
      { id: "familiar", label: "Familiar (40cm)", precio: 55, activo: true },
    ],
    extras: [
      { id: "orilla", label: "Orilla rellena de queso", precio: 5, activo: true },
      { id: "doblequeso", label: "Doble queso", precio: 4, activo: true },
      { id: "sincebolla", label: "Sin cebolla", precio: 0, activo: true },
      { id: "extrasalsa", label: "Extra salsa", precio: 0, activo: true },
    ],
    bebidas: [
      { id: "coca500", label: "Coca Cola 500ml", precio: 5, activo: true },
      { id: "inca500", label: "Inca Kola 500ml", precio: 5, activo: true },
      { id: "agua", label: "Agua San Luis", precio: 3, activo: true },
      { id: "coca15", label: "Coca Cola 1.5L", precio: 9, activo: true },
      { id: "inca15", label: "Inca Kola 1.5L", precio: 9, activo: true },
    ],
  };

  // ── STATE ──────────────────────────────────────────────────────────────────
  let step = 0;
  let menu = DEFAULT_MENU;
  let form = { pizza: null, tamano: null, extras: [], bebidas: [], nombre: "", telefono: "", direccion: "", referencia: "", notas: "" };

  // ── INIT ───────────────────────────────────────────────────────────────────
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) menu = JSON.parse(s); } catch {}
  render();

  // ── SUPABASE ───────────────────────────────────────────────────────────────
  async function sbInsert(table, data) {
    const res = await fetch(`${SB_URL}/rest/v1/${table}`, {
      method: "POST",
      headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(await res.text());
  }

  // ── HELPERS ────────────────────────────────────────────────────────────────
  function getTotal() {
    let t = 0;
    if (form.tamano) t += form.tamano.precio;
    form.extras.forEach(e => t += e.precio);
    form.bebidas.forEach(b => t += b.precio);
    return t;
  }

  function activePizzas() { return menu.pizzas.filter(p => p.activo); }
  function activeTamanos() { return menu.tamanos.filter(t => t.activo); }
  function activeExtras() { return menu.extras.filter(e => e.activo); }
  function activeBebidas() { return menu.bebidas.filter(b => b.activo); }

  function canNext() {
    if (step === 0) return !!form.pizza;
    if (step === 1) return !!form.tamano;
    if (step === 3) return form.nombre && form.telefono && form.direccion;
    return true;
  }

  function toggleItem(item, key) {
    const arr = form[key];
    const idx = arr.findIndex(x => x.id === item.id);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(item);
    render();
  }

  // ── RENDER ─────────────────────────────────────────────────────────────────
  function render() {
    renderProgress();
    renderStep();
    renderFloating();
  }

  function renderProgress() {
    document.getElementById("progress").innerHTML = STEPS.map((s, i) => `
      <div class="prog-item">
        <div class="prog-dot ${i < step ? "done" : i === step ? "active" : ""}">${i < step ? "✓" : i + 1}</div>
        <div class="prog-label ${i === step ? "active" : ""}">${s}</div>
      </div>
    `).join("");
  }

  function renderStep() {
    const c = document.getElementById("step-container");
    if (step === 0) {
      const pizzas = activePizzas();
      c.innerHTML = `
        <div class="step-title">¿Qué pizza quieres?</div>
        ${pizzas.length === 0 ? '<div class="empty-msg">El menú está siendo actualizado 🍕</div>' :
          `<div class="pizza-grid">${pizzas.map(p => `
            <button class="pizza-card ${form.pizza === p.id ? "selected" : ""}" onclick="selectPizza('${p.id}')">
              ${p.imagen ? `<img class="pizza-card-img" src="${p.imagen}" alt="${p.name}">` : `<div class="pizza-card-placeholder">${p.emoji}</div>`}
              <div class="pizza-card-body">
                <div class="pizza-name">${p.name}</div>
                <div class="pizza-desc">${p.desc}</div>
              </div>
              ${form.pizza === p.id ? '<div class="check-badge">✓</div>' : ""}
            </button>
          `).join("")}</div>`
        }
        <div class="nav"><button class="btn-next" ${!form.pizza ? "disabled" : ""} onclick="nextStep()">Continuar →</button></div>
      `;
    } else if (step === 1) {
      c.innerHTML = `
        <div class="step-title">Elige el tamaño</div>
        <div class="size-list">${activeTamanos().map(t => `
          <button class="size-card ${form.tamano?.id === t.id ? "selected" : ""}" onclick='selectTamano(${JSON.stringify(t)})'>
            <span class="size-name">${t.label}</span>
            <span class="size-price">S/. ${t.precio}</span>
          </button>
        `).join("")}</div>
        <div class="nav">
          <button class="btn-back" onclick="prevStep()">← Atrás</button>
          <button class="btn-next" ${!form.tamano ? "disabled" : ""} onclick="nextStep()">Continuar →</button>
        </div>
      `;
    } else if (step === 2) {
      const extras = activeExtras();
      const bebidas = activeBebidas();
      c.innerHTML = `
        <div class="step-title">Personaliza tu pedido</div>
        ${extras.length > 0 ? `<div class="sec-label">EXTRAS</div><div class="tag-grid">${extras.map(e => `
          <button class="tag ${form.extras.find(x=>x.id===e.id) ? "selected" : ""}" onclick='toggleExtra(${JSON.stringify(e)})'>
            ${form.extras.find(x=>x.id===e.id) ? "✓ " : "+ "}${e.label}${e.precio > 0 ? ` (+S/.${e.precio})` : ""}
          </button>`).join("")}</div>` : ""}
        ${bebidas.length > 0 ? `<div class="sec-label">BEBIDAS</div><div class="tag-grid">${bebidas.map(b => `
          <button class="tag ${form.bebidas.find(x=>x.id===b.id) ? "selected" : ""}" onclick='toggleBebida(${JSON.stringify(b)})'>
            ${form.bebidas.find(x=>x.id===b.id) ? "✓ " : "+ "}${b.label} — S/.${b.precio}
          </button>`).join("")}</div>` : ""}
        <div class="nav">
          <button class="btn-back" onclick="prevStep()">← Atrás</button>
          <button class="btn-next" onclick="nextStep()">Continuar →</button>
        </div>
      `;
    } else if (step === 3) {
      c.innerHTML = `
        <div class="step-title">¿A dónde enviamos tu pedido?</div>
        ${[
          {key:"nombre", label:"Nombre completo", ph:"Juan Pérez", type:"text"},
          {key:"telefono", label:"Celular", ph:"987 654 321", type:"tel"},
          {key:"direccion", label:"Dirección de entrega", ph:"Av. Larco 234, Miraflores", type:"text"},
          {key:"referencia", label:"Referencia (opcional)", ph:"Frente al parque, edificio rojo…", type:"text"},
          {key:"notas", label:"Notas adicionales (opcional)", ph:"Sin cebolla, tocar el timbre…", type:"text"},
        ].map(f => `
          <div class="field">
            <label>${f.label}</label>
            <input type="${f.type}" placeholder="${f.ph}" value="${form[f.key]}" oninput="updateField('${f.key}', this.value)" />
          </div>
        `).join("")}
        <div class="nav">
          <button class="btn-back" onclick="prevStep()">← Atrás</button>
          <button class="btn-next" ${!canNext() ? "disabled" : ""} onclick="nextStep()">Revisar pedido →</button>
        </div>
      `;
    } else if (step === 4) {
      const p = activePizzas().find(x => x.id === form.pizza);
      const total = getTotal();
      c.innerHTML = `
        <div class="step-title">Confirma tu pedido</div>
        <div class="summary">
          <div class="sum-row"><span class="sum-key">Pizza</span><span>${p?.emoji} ${p?.name}</span></div>
          <div class="sum-row"><span class="sum-key">Tamaño</span><span>${form.tamano?.label}</span></div>
          ${form.extras.length > 0 ? `<div class="sum-row"><span class="sum-key">Extras</span><span class="sum-right">${form.extras.map(e=>e.label).join(", ")}</span></div>` : ""}
          ${form.bebidas.length > 0 ? `<div class="sum-row"><span class="sum-key">Bebidas</span><span class="sum-right">${form.bebidas.map(b=>b.label).join(", ")}</span></div>` : ""}
          <div class="divider"></div>
          <div class="sum-row"><span class="sum-key">Nombre</span><span>${form.nombre}</span></div>
          <div class="sum-row"><span class="sum-key">Celular</span><span>${form.telefono}</span></div>
          <div class="sum-row"><span class="sum-key">Dirección</span><span class="sum-right">${form.direccion}</span></div>
          ${form.referencia ? `<div class="sum-row"><span class="sum-key">Referencia</span><span class="sum-right">${form.referencia}</span></div>` : ""}
          ${form.notas ? `<div class="sum-row"><span class="sum-key">Notas</span><span class="sum-right">${form.notas}</span></div>` : ""}
          <div class="divider"></div>
          <div class="sum-row"><span style="font-weight:700">TOTAL</span><span class="sum-total">S/. ${total}.00</span></div>
        </div>
        <div class="nav">
          <button class="btn-back" onclick="prevStep()">← Atrás</button>
          <button class="btn-next" id="submit-btn" onclick="submitOrder()">🍕 Enviar pedido</button>
        </div>
      `;
    }
  }

  function renderFloating() {
    const t = getTotal();
    const el = document.getElementById("floating-total");
    el.style.display = t > 0 ? "block" : "none";
    el.innerHTML = `Total: <strong>S/. ${t}.00</strong>`;
  }

  // ── ACTIONS ────────────────────────────────────────────────────────────────
  function selectPizza(id) { form.pizza = id; render(); }
  function selectTamano(t) { form.tamano = t; render(); }
  function toggleExtra(e) { toggleItem(e, "extras"); }
  function toggleBebida(b) { toggleItem(b, "bebidas"); }
  function updateField(key, val) { form[key] = val; if (step === 3) document.querySelector(".btn-next").disabled = !canNext(); renderFloating(); }
  function nextStep() { if (step < 4) { step++; render(); window.scrollTo(0, 0); } }
  function prevStep() { if (step > 0) { step--; render(); window.scrollTo(0, 0); } }

  async function submitOrder() {
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    document.getElementById("error-msg").style.display = "none";

    const num = Math.floor(1000 + Math.random() * 9000);
    const p = activePizzas().find(x => x.id === form.pizza);

    try {
      await sbInsert("pedidos", {
        order_number: num,
        pizza: form.pizza,
        pizza_nombre: p?.name,
        tamano: form.tamano?.label,
        extras: form.extras.map(e => e.label),
        bebidas: form.bebidas.map(b => b.label),
        nombre: form.nombre,
        telefono: form.telefono,
        direccion: form.direccion,
        referencia: form.referencia,
        notas: form.notas,
        total: getTotal(),
        estado: "pendiente",
      });
      showSuccess(num, p);
    } catch {
      const err = document.getElementById("error-msg");
      err.textContent = "No se pudo enviar el pedido. Intenta nuevamente.";
      err.style.display = "block";
      btn.disabled = false;
      btn.innerHTML = "🍕 Enviar pedido";
    }
  }

  function showSuccess(num, p) {
    document.getElementById("step-container").style.display = "none";
    document.getElementById("progress").style.display = "none";
    document.getElementById("floating-total").style.display = "none";
    const wrap = document.getElementById("success-wrap");
    wrap.style.display = "block";
    document.getElementById("success-sub").textContent = `Pedido #${num} registrado ✓`;
    document.getElementById("success-rows").innerHTML = `
      <div class="success-detail"><span style="color:#555">Pizza</span><span>${p?.emoji} ${p?.name}</span></div>
      <div class="success-detail"><span style="color:#555">Tamaño</span><span>${form.tamano?.label}</span></div>
      ${form.extras.length > 0 ? `<div class="success-detail"><span style="color:#555">Extras</span><span style="text-align:right;max-width:60%">${form.extras.map(e=>e.label).join(", ")}</span></div>` : ""}
      ${form.bebidas.length > 0 ? `<div class="success-detail"><span style="color:#555">Bebidas</span><span style="text-align:right;max-width:60%">${form.bebidas.map(b=>b.label).join(", ")}</span></div>` : ""}
      <div class="success-detail"><span style="color:#555">Dirección</span><span style="text-align:right;max-width:60%">${form.direccion}</span></div>
    `;
    document.getElementById("success-total").textContent = `S/. ${getTotal()}.00`;
    document.getElementById("success-note").textContent = `Te contactaremos al ${form.telefono} para confirmar tu entrega.`;
  }

  function resetForm() {
    form = { pizza: null, tamano: null, extras: [], bebidas: [], nombre: "", telefono: "", direccion: "", referencia: "", notas: "" };
    step = 0;
    document.getElementById("success-wrap").style.display = "none";
    document.getElementById("step-container").style.display = "block";
    document.getElementById("progress").style.display = "flex";
    render();
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
